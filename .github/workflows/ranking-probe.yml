name: Death List ranking probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and parse current Death List
        shell: python
        run: |
          import html
          import json
          import re
          import urllib.request

          req = urllib.request.Request(
              "https://canivibecodeit.com/",
              headers={"User-Agent": "desktop-apps-ranking-probe/1.0"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              page = response.read().decode("utf-8")

          rows = []
          pattern = re.compile(r'<a\s+class="row"(?P<attrs>.*?)>(?P<body>.*?)</a>', re.S)
          for match in pattern.finditer(page):
              attrs = match.group("attrs")
              body = match.group("body")
              def attr(name):
                  found = re.search(fr'{name}="([^"]*)"', attrs)
                  return html.unescape(found.group(1)) if found else ""
              def text_for(cls):
                  found = re.search(fr'<span class="{cls}"[^>]*>(.*?)</span>', body, re.S)
                  if not found:
                      return ""
                  return html.unescape(re.sub(r'<[^>]+>', '', found.group(1))).strip()
              rank_text = text_for("rank")
              vote_match = re.search(r'<span class="c-votes"[^>]*>(.*?)</span>', body, re.S)
              votes = int(re.sub(r'\D', '', vote_match.group(1))) if vote_match else 0
              rows.append({
                  "rank": int(rank_text) if rank_text.isdigit() else None,
                  "slug": attr("href").lstrip("/"),
                  "name": text_for("name"),
                  "verdict": attr("data-verdict"),
                  "category": attr("data-category"),
                  "votes": votes,
              })

          yes_rows = [row for row in rows if row["verdict"] == "yes"]
          print("DEATH_LIST_YES_JSON=" + json.dumps(yes_rows[:300], separators=(",", ":")))
          print(f"TOTAL_ROWS={len(rows)} TOTAL_YES={len(yes_rows)}")
